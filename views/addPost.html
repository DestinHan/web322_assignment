<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        .navbar-custom {
            background-color: white; 
        }
        .navbar-custom .navbar-brand, .navbar-custom .nav-link {
            color: black;
        }
        .navbar-custom .nav-link:hover {
            color: black;
        }
      
        body {
            background-color: white
        }
      </style>
      
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container-fluid">
          <a class="navbar-brand" href="#">Seung Hoon Han</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="/">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="/about">About</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="/articles">Articles</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="/categories">Categories</a>
              </li>
              <li class="nav-item">
                <a class="nav-link active" href="/posts/add">Add Post</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>

      <section class="container mt-5">
        <h3>Add a New Post</h3>
        <form action="/posts/add" method="post" enctype="multipart/form-data">
            <div class="mb-3">
                <label for="title" class="form-label">Post Title</label>
                <input type="text" id="title" name="title" class="form-control" placeholder="Enter the title here" required>
            </div>
            
            <div class="mb-3">
                <label for="body" class="form-label">Post Content</label>
                <textarea id="body" name="body" class="form-control" rows="4" placeholder="Write your content here" required></textarea>
            </div>
            
            <div class="mb-3">
                <label for="featureImage" class="form-label">Choose an Image</label>
                <input type="file" id="featureImage" name="featureImage" class="form-control" accept="image/*">
            </div>
            
            <div class="form-check mb-3">
                <input type="checkbox" id="published" name="published" class="form-check-input">
                <label for="published" class="form-check-label">Publish Now</label>
            </div>
            
            <button type="submit" class="btn btn-primary">Submit Post</button>
        </form>
    </section>
    
    
    </section>
    
    <footer class="bg-light text-center py-4">
